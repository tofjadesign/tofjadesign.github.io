<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>birthday calendar — August</title>

    <!-- Handwriting font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="calendar-page">

<header class="calendar-intro">
  <h1>
    🇳🇱 A very Dutch tradition: the birthday calendar.
    <span>It’s often found hanging… in the toilet. 🚽</span>
  </h1>

  <p>
       Born in August? Add your name to the calendar!
    Why the toilet? You’re sitting there anyway. 😄
  </p>
</header>



    <div class="calendar">

        <!-- Hanging hole -->
        <div class="hanging-hole"></div>

        <!-- Image -->
        <div class="calendar-image">
            <img
                src="https://i.imgur.com/eyIaQTe.jpeg"
                alt=""
            >
        </div>

        <!-- Image credit -->
        <div class="image-credit">
            Photo: Sunflowers
        </div>


        <!-- Month -->
        <header class="calendar-header">
            <h1>August</h1>
        </header>


        <!-- Birthday list -->
        <section class="birthday-list" aria-label="Verjaardagen in augustus">
